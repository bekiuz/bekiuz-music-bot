name: Check Python syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify framework import
        run: python -c "import aiogram, pydantic; print('aiogram', aiogram.__version__, '| pydantic', pydantic.__version__)"
      - name: Compile bot source
        run: python -m py_compile bot.py main.py
